name: Build and Test OpenJPA

on:
  push:
    branches: [ master, test_isw2 ]
  pull_request:
    branches: [ master, test_isw2 ]

env:
  RUN_TESTS: true   # metti false se vuoi disabilitarli temporaneamente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Build all modules (install SNAPSHOTs)
        run: mvn -B clean install -DskipTests

      - name: Run tests
        if: env.RUN_TESTS == 'true'
        run: mvn -B test

      - name: Tests disabled
        if: env.RUN_TESTS != 'true'
        run: echo "Tests are disabled"