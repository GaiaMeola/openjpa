name: Build and Test OpenJPA

on:
  push:
    branches: [ master, test_isw2 ]
  pull_request:
    branches: [ master, test_isw2 ]

env:
  RUN_TESTS: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Build and Install (No Tests)
        # Popola la cartella target e la cache .m2 locale senza eseguire test
        run: mvn -B clean install -DskipTests

      - name: Run Unit Tests (Surefire)
        if: env.RUN_TESTS == 'true'
        # Esegue i test di unità isolati (spesso usando Mockito)
        run: mvn -B test

      - name: Run Integration Tests (Failsafe)
        if: env.RUN_TESTS == 'true'
        # Esegue i test di integrazione e verifica il pacchetto finale
        # Usiamo 'verify' perché è la fase in cui Failsafe entra in azione
        run: mvn -B verify -DskipUnitTests

      - name: Tests disabled
        if: env.RUN_TESTS != 'true'
        run: echo "Tests are disabled"